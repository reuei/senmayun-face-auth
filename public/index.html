  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* 渐变背景 */
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* 玻璃态效果 */
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);

    }
    
    /* 卡片悬停效果 */
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    
    /* 按钮渐变 */
    .btn-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 4px;
    }
    
    /* 加载动画 */
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* 扫描线效果 */
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #667eea, transparent);
      animation: scan 2s linear infinite;
    }
    
    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }
    
    /* 脉冲环 */
    .pulse-ring {
      position: absolute;
      border: 2px solid #667eea;
      border-radius: 50%;
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    
    @keyframes pulse-ring {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }
    
    /* 页面切换动画 */
    .page-enter-active,
    .page-leave-active {
      transition: all 0.3s ease;
    }
    .page-enter-from {
      opacity: 0;
      transform: translateX(20px);
    }
    .page-leave-to {
      opacity: 0;
      transform: translateX(-20px);
    }
    
    /* Element Plus 主题定制 */
    .el-button--primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
    }
    .el-button--primary:hover {
      opacity: 0.9;
    }
  </style>
</head>

    const { createApp, ref, reactive, computed, onMounted, watch, nextTick } = Vue;
    const { createRouter, createWebHistory, useRoute, useRouter } = VueRouter;
    const { createPinia, defineStore } = Pinia;

    // API 基础配置
    const API_BASE = '/api/v1';
    
    // Axios 实例
    const api = axios.create({
      baseURL: API_BASE,
      timeout: 30000
    });
    
    // 请求拦截器
    api.interceptors.request.use(config => {
      const token = localStorage.getItem('admin_token');
      if (token) {
        config.headers['Authorization'] = 'Bearer ' + token;
      }
      return config;
    });
    
    // 响应拦截器
    api.interceptors.response.use(
      response => response.data,
      error => {
        if (error.response?.status === 401) {
          localStorage.removeItem('admin_token');
          window.location.href = '/admin/login';
        }
        return Promise.reject(error);
      }
    );

    // 页面组件
    // ============================================

          { path: 'logs', component: { template: '<div class="bg-white rounded-2xl p-8 text-center"><i class="fas fa-history text-5xl text-gray-300 mb-4"></i><h3 class="text-xl font-semibold text-gray-700 mb-2">操作日志</h3><p class="text-gray-500">功能开发中...</p></div>' } }
        ]
      },
      { path: '/:pathMatch(.*)*', component: { template: '<div class="min-h-screen flex items-center justify-center bg-gray-50"><div class="text-center"><div class="text-9xl font-bold gradient-text mb-4">404</div><h2 class="text-2xl font-semibold text-gray-700 mb-2">页面未找到</h2><p class="text-gray-500 mb-8">您访问的页面不存在</p><button onclick="location.href=\'/\'" class="btn-gradient text-white px-8 py-3 rounded-full font-medium">返回首页</button></div></div>' } }
    ];

    const router = createRouter({
      history: createWebHistory(),
      routes
    });

    // ============================================
    // 创建应用
    // ============================================
    const app = createApp({
      setup() {
        const loading = ref(true);
        
        onMounted(() => {
          setTimeout(() => {
            loading.value = false;
          }, 500);
        });
        
        return { loading };
      }
    });

    app.use(router);
    app.use(createPinia());
    app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });

    app.mount('#app');
  </script>
</body>
</html>
