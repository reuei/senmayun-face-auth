<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 森码云实人认证</title>
  
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#667eea',
            secondary: '#764ba2',
            success: '#10b981',
            danger: '#ef4444',
            warning: '#f59e0b',
            info: '#3b82f6',
            dark: '#1f2937'
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif']
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'scale-in': 'scaleIn 0.2s ease-out'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            }
          }
        }
      }
    }
  </script>
  
  <!-- Element Plus -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .btn-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08); }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1a1; }
    
    .pulse-ring {
      position: absolute;
      border: 2px solid #10b981;
      border-radius: 50%;
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    
    /* Element Plus 主题 */
    .el-button--primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
    }
    .el-table th { background: #f9fafb !important; }
    .el-pagination.is-background .el-pager li:not(.disabled).is-active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body>
  <!-- 页面加载动画 -->
  <div id="pageLoader" class="fixed inset-0 z-[9999] flex items-center justify-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="text-center text-white">
      <div class="relative w-20 h-20 mx-auto mb-6">
        <div class="absolute inset-0 border-3 border-transparent border-t-white rounded-full" style="animation: spin 1s linear infinite;"></div>
        <div class="absolute inset-2 border-3 border-transparent border-t-white/60 rounded-full" style="animation: spin 1.5s linear infinite reverse;"></div>
        <div class="absolute inset-4 border-3 border-transparent border-t-white/30 rounded-full" style="animation: spin 2s linear infinite;"></div>
        <div class="absolute inset-0 flex items-center justify-center">
          <i class="fas fa-fingerprint text-2xl"></i>
        </div>
      </div>
      <div class="text-lg font-medium mb-2">森码云实人认证</div>
      <div class="text-sm opacity-70 mb-4">管理后台加载中...</div>
      <div class="w-48 h-1 mx-auto bg-white/20 rounded-full overflow-hidden">
        <div class="h-full bg-white rounded-full" style="width: 0%; animation: loaderProgress 2s ease-in-out infinite;"></div>
      </div>
    </div>
  </div>
  
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes loaderProgress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
    .border-3 { border-width: 3px; }
  </style>

  <div id="app">
    <div v-if="loading" class="fixed inset-0 flex items-center justify-center bg-white z-50">
      <div class="text-center">
        <div class="w-10 h-10 border-4 border-gray-200 border-t-primary rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-gray-500">加载中...</p>
      </div>
    </div>
  </div>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Element Plus -->
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/element-plus/dist/locale/zh-cn.js"></script>
  <!-- Vue Router -->
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <!-- Pinia -->
  <script src="https://unpkg.com/pinia@2/dist/pinia.iife.prod.js"></script>
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script>
    const { createApp, ref, reactive, computed, onMounted, watch, nextTick } = Vue;
    const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;
    const { createPinia } = Pinia;

    // ============================================
    // 登录页
    // ============================================
    const LoginView = {
      template: `
        <div class="min-h-screen flex">
          <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
            <div class="w-full max-w-md">
              <div class="mb-8">
                <div class="flex items-center gap-3 mb-2">
                  <div class="w-12 h-12 rounded-xl gradient-bg flex items-center justify-center">
                    <i class="fas fa-fingerprint text-white text-xl"></i>
                  </div>
                  <span class="text-2xl font-bold gradient-text">森码云</span>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 mt-6">欢迎回来</h1>
                <p class="text-gray-500 mt-2">登录管理后台</p>
              </div>

              <form @submit.prevent="handleLogin" class="space-y-5">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                  <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input v-model="form.username" type="text" 
                           class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition"
                           placeholder="请输入用户名">
                  </div>
                </div>
                
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                  <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input v-model="form.password" :type="showPassword ? 'text' : 'password'"
                           class="w-full pl-12 pr-12 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition"
                           placeholder="请输入密码">
                    <button type="button" @click="showPassword = !showPassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                      <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                  </div>
                </div>

                <div class="flex items-center justify-between">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" v-model="form.remember" class="rounded text-primary">
                    <span class="text-sm text-gray-600">记住我</span>
                  </label>
                  <a href="#" class="text-sm text-primary hover:underline">忘记密码？</a>
                </div>

                <button type="submit" 
                        class="w-full btn-gradient text-white py-3 rounded-xl font-medium flex items-center justify-center gap-2"
                        :disabled="loading">
                  <i v-if="loading" class="fas fa-spinner fa-spin"></i>
                  <span>{{ loading ? '登录中...' : '登录' }}</span>
                </button>
              </form>

              <div class="mt-8 text-center text-sm text-gray-500">
                <p>默认账号：admin / admin123</p>
              </div>
            </div>
          </div>

          <div class="hidden lg:flex lg:w-1/2 gradient-bg items-center justify-center p-12 relative overflow-hidden">
            <div class="absolute inset-0 opacity-10">
              <div class="absolute top-20 left-20 w-64 h-64 bg-white rounded-full blur-3xl animate-float"></div>
              <div class="absolute bottom-20 right-20 w-80 h-80 bg-white rounded-full blur-3xl animate-float" style="animation-delay: -3s;"></div>
            </div>
            
            <div class="relative text-white max-w-md">
              <h2 class="text-4xl font-bold mb-6">管理后台</h2>
              <p class="text-white/80 text-lg mb-8 leading-relaxed">
                强大的管理功能，让您轻松管理实人认证业务。
                查看数据统计、管理API通道、配置系统设置。
              </p>
              
              <div class="space-y-4">
                <div v-for="feature in features" :key="feature.title" 
                     class="flex items-center gap-4 bg-white/10 backdrop-blur rounded-xl p-4">
                  <div class="w-12 h-12 rounded-xl bg-white/20 flex items-center justify-center">
                    <i :class="feature.icon" class="text-xl"></i>
                  </div>
                  <div>
                    <div class="font-medium">{{ feature.title }}</div>
                    <div class="text-sm text-white/70">{{ feature.desc }}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const router = useRouter();
        const form = reactive({ username: 'admin', password: 'admin123', remember: false });
        const showPassword = ref(false);
        const loading = ref(false);
        
        const features = [
          { icon: 'fas fa-chart-line', title: '数据统计', desc: '实时监控认证数据和趋势' },
          { icon: 'fas fa-server', title: '通道管理', desc: '多通道配置和智能调度' },
          { icon: 'fas fa-cog', title: '系统设置', desc: '灵活配置各项参数' }
        ];
        
        function handleLogin() {
          loading.value = true;
          setTimeout(() => {
            localStorage.setItem('admin_token', 'demo_token');
            router.push('/');
          }, 1000);
        }
        
        return { form, showPassword, loading, features, handleLogin };
      }
    };

    // ============================================
    // 后台布局
    // ============================================
    const AdminLayout = {
      template: `
        <div class="min-h-screen bg-gray-50 flex">
          <!-- 侧边栏 -->
          <aside class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-30 transition-all"
                 :class="{ 'w-20': collapsed }">
            <div class="h-16 flex items-center px-4 border-b border-gray-100">
              <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center flex-shrink-0">
                <i class="fas fa-fingerprint text-white"></i>
              </div>
              <div v-if="!collapsed" class="ml-3">
                <div class="font-bold text-gray-900">森码云</div>
                <div class="text-xs text-gray-500">管理后台</div>
              </div>
            </div>

            <nav class="flex-1 py-4 overflow-y-auto">
              <div class="px-3 mb-4">
                <div v-if="!collapsed" class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-2 px-3">主菜单</div>
                <div v-for="item in menuItems" :key="item.path"
                     @click="goTo(item.path)"
                     class="flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer transition-all mb-1"
                     :class="isActive(item.path) ? 'gradient-bg text-white shadow-lg' : 'text-gray-600 hover:bg-gray-50'">
                  <i :class="item.icon" class="text-lg w-5 text-center"></i>
                  <span v-if="!collapsed" class="text-sm font-medium">{{ item.name }}</span>
                </div>
              </div>
              
              <div class="px-3 mb-4">
                <div v-if="!collapsed" class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-2 px-3">系统管理</div>
                <div v-for="item in systemItems" :key="item.path"
                     @click="goTo(item.path)"
                     class="flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer transition-all mb-1"
                     :class="isActive(item.path) ? 'gradient-bg text-white shadow-lg' : 'text-gray-600 hover:bg-gray-50'">
                  <i :class="item.icon" class="text-lg w-5 text-center"></i>
                  <span v-if="!collapsed" class="text-sm font-medium">{{ item.name }}</span>
                </div>
              </div>
            </nav>

            <div class="p-4 border-t border-gray-100">
              <div @click="logout" 
                   class="flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer text-gray-600 hover:bg-red-50 hover:text-red-500 transition-all">
                <i class="fas fa-sign-out-alt text-lg w-5 text-center"></i>
                <span v-if="!collapsed" class="text-sm font-medium">退出登录</span>
              </div>
            </div>
          </aside>

          <div class="flex-1" :class="{ 'ml-64': !collapsed, 'ml-20': collapsed }">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-20">
              <div class="flex items-center gap-4">
                <button @click="collapsed = !collapsed" 
                        class="w-10 h-10 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500 transition">
                  <i :class="collapsed ? 'fas fa-indent' : 'fas fa-outdent'"></i>
                </button>
                <h1 class="text-lg font-semibold text-gray-900">{{ currentTitle }}</h1>
              </div>
              
              <div class="flex items-center gap-4">
                <button class="w-10 h-10 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500 transition relative">
                  <i class="fas fa-bell"></i>
                  <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div class="flex items-center gap-3 cursor-pointer">
                  <div class="w-9 h-9 rounded-full gradient-bg flex items-center justify-center text-white text-sm font-medium">
                    A
                  </div>
                  <div class="hidden md:block">
                    <div class="text-sm font-medium text-gray-900">admin</div>
                    <div class="text-xs text-gray-500">管理员</div>
                  </div>
                </div>
              </div>
            </header>

            <main class="p-6">
              <router-view v-slot="{ Component }">
                <transition name="fade" mode="out-in">
                  <component :is="Component" />
                </transition>
              </router-view>
            </main>
          </div>
        </div>
      `,
      setup() {
        const router = useRouter();
        const route = useRoute();
        const collapsed = ref(false);
        
        const menuItems = [
          { path: '/dashboard', name: '仪表盘', icon: 'fas fa-chart-pie' },
          { path: '/verifications', name: '认证记录', icon: 'fas fa-list-alt' },
          { path: '/channels', name: 'API通道', icon: 'fas fa-server' }
        ];
        
        const systemItems = [
          { path: '/mofang', name: '魔方财务', icon: 'fas fa-coins' },
          { path: '/settings', name: '系统设置', icon: 'fas fa-cog' },
          { path: '/logs', name: '操作日志', icon: 'fas fa-history' }
        ];
        
        const currentTitle = computed(() => {
          const allItems = [...menuItems, ...systemItems];
          const item = allItems.find(i => route.path.startsWith(i.path));
          return item ? item.name : '仪表盘';
        });
        
        function isActive(path) {
          return route.path.startsWith(path);
        }
        
        function goTo(path) {
          router.push(path);
        }
        
        function logout() {
          ElementPlus.ElMessageBox.confirm('确定要退出登录吗？', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            localStorage.removeItem('admin_token');
            router.push('/login');
          }).catch(() => {});
        }
        
        return { collapsed, menuItems, systemItems, currentTitle, isActive, goTo, logout };
      }
    };

    // ============================================
    // 仪表盘
    // ============================================
    const DashboardView = {
      template: `
        <div class="space-y-6 animate-fade-in">
          <!-- 统计卡片 -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div v-for="(stat, index) in stats" :key="index"
                 class="bg-white rounded-2xl p-6 shadow-sm card-hover">
              <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center"
                     :style="{ background: stat.color + '15' }">
                  <i :class="stat.icon" class="text-xl" :style="{ color: stat.color }"></i>
                </div>
                <span class="text-sm" :class="stat.trend > 0 ? 'text-success' : 'text-danger'">
                  <i :class="stat.trend > 0 ? 'fas fa-arrow-up' : 'fas fa-arrow-down'"></i>
                  {{ Math.abs(stat.trend) }}%
                </span>
              </div>
              <div class="text-2xl font-bold text-gray-900 mb-1">{{ stat.value }}</div>
              <div class="text-sm text-gray-500">{{ stat.label }}</div>
            </div>
          </div>

          <!-- 图表区域 -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm">
              <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-semibold text-gray-900">认证趋势</h3>
                <div class="flex gap-2">
                  <button v-for="range in ranges" :key="range.value"
                          @click="activeRange = range.value"
                          class="px-3 py-1 text-sm rounded-lg transition"
                          :class="activeRange === range.value ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'">
                    {{ range.label }}
                  </button>
                </div>
              </div>
              <div ref="trendChartRef" style="height: 300px;"></div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
              <h3 class="text-lg font-semibold text-gray-900 mb-6">通道使用占比</h3>
              <div ref="pieChartRef" style="height: 250px;"></div>
              <div class="space-y-2 mt-4">
                <div v-for="item in channelStats" :key="item.name" 
                     class="flex items-center justify-between text-sm">
                  <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full" :style="{ background: item.color }"></span>
                    <span class="text-gray-600">{{ item.name }}</span>
                  </div>
                  <span class="font-medium text-gray-900">{{ item.value }}%</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 最近记录 + 系统状态 -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm">
              <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-semibold text-gray-900">最近认证</h3>
                <button @click="$router.push('/verifications')" class="text-sm text-primary hover:underline">查看全部</button>
              </div>
              <el-table :data="recentRecords" style="width: 100%" :show-header="true">
                <el-table-column prop="id" label="编号" width="140">
                  <template #default="scope">
                    <span class="font-mono text-sm text-gray-600">{{ scope.row.id }}</span>
                  </template>
                </el-table-column>
                <el-table-column prop="user" label="用户" width="100"></el-table-column>
                <el-table-column prop="status" label="状态" width="80">
                  <template #default="scope">
                    <el-tag :type="scope.row.status === '通过' ? 'success' : 'danger'" size="small">
                      {{ scope.row.status }}
                    </el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="channel" label="通道" width="100"></el-table-column>
                <el-table-column prop="time" label="时间"></el-table-column>
              </el-table>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
              <h3 class="text-lg font-semibold text-gray-900 mb-6">系统状态</h3>
              <div class="space-y-4">
                <div v-for="item in systemStatus" :key="item.name"
                     class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg flex items-center justify-center"
                         :style="{ background: item.color + '15' }">
                      <i :class="item.icon" :style="{ color: item.color }"></i>
                    </div>
                    <div>
                      <div class="text-sm font-medium text-gray-900">{{ item.name }}</div>
                      <div class="text-xs text-gray-500">{{ item.desc }}</div>
                    </div>
                  </div>
                  <div class="flex items-center gap-1 text-success text-sm">
                    <span class="w-2 h-2 bg-success rounded-full animate-pulse"></span>
                    正常
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const trendChartRef = ref(null);
        const pieChartRef = ref(null);
        const activeRange = ref('7d');
        
        const ranges = [
          { label: '7天', value: '7d' },
          { label: '30天', value: '30d' }

                  <el-option label="通道管理" value="channel"></el-option>
                  <el-option label="删除操作" value="delete"></el-option>
                  <el-option label="其他" value="other"></el-option>
                </el-select>
              </div>
              <div class="flex-1 min-w-[150px]">
                <label class="block text-sm text-gray-600 mb-2">操作人</label>
                <el-input v-model="filters.username" placeholder="用户名" clearable></el-input>
              </div>
              <div class="flex-1 min-w-[250px]">
                <label class="block text-sm text-gray-600 mb-2">日期范围</label>
                <el-date-picker
                  v-model="filters.dateRange"
                  type="daterange"
                  range-separator="至"
                  start-placeholder="开始日期"
                  end-placeholder="结束日期"
                  style="width: 100%">
                </el-date-picker>
              </div>
              <div class="flex gap-2">
                <button class="btn-gradient text-white px-6 py-2 rounded-lg font-medium">
                  <i class="fas fa-search mr-2"></i>查询
                </button>
                <button @click="resetFilters" class="border border-gray-300 text-gray-600 px-6 py-2 rounded-lg font-medium hover:bg-gray-50">
                  <i class="fas fa-redo mr-2"></i>重置
                </button>
              </div>
            </div>
          </div>

          <!-- 日志列表 -->
          <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex items-center justify-between">
              <h3 class="text-lg font-semibold text-gray-900">操作日志</h3>
              <span class="text-sm text-gray-500">共 {{ total }} 条记录</span>
            </div>
            <el-table :data="logs" style="width: 100%">
              <el-table-column prop="createdAt" label="时间" width="180">
                <template #default="scope">
                  <span class="text-gray-500">{{ scope.row.createdAt }}</span>
                </template>
              </el-table-column>
              <el-table-column prop="username" label="操作人" width="120"></el-table-column>
              <el-table-column prop="type" label="操作类型" width="120">
                <template #default="scope">
                  <el-tag :type="typeColor(scope.row.type)" size="small">
                    {{ typeText(scope.row.type) }}
                  </el-tag>
                </template>
              </el-table-column>
              <el-table-column prop="action" label="操作描述"></el-table-column>
              <el-table-column prop="ip" label="IP地址" width="140">
                <template #default="scope">
                  <span class="font-mono text-sm text-gray-600">{{ scope.row.ip }}</span>
                </template>
              </el-table-column>
              <el-table-column prop="status" label="状态" width="100">
                <template #default="scope">
                  <el-tag :type="scope.row.status === 'success' ? 'success' : 'danger'" size="small">
                    {{ scope.row.status === 'success' ? '成功' : '失败' }}
                  </el-tag>
                </template>
              </el-table-column>
            </el-table>
            <div class="p-4 border-t border-gray-100 flex justify-end">
              <el-pagination
                v-model:current-page="currentPage"
                :page-size="20"
                :total="328"
                layout="total, prev, pager, next, jumper">
              </el-pagination>
            </div>
          </div>
        </div>
      `,
      setup() {
        const filters = reactive({
          type: '',
          username: '',
          dateRange: []
        });
        const currentPage = ref(1);
        const total = ref(328);
        
        const logs = [
          { id: 1, username: 'admin', type: 'login', action: '管理员登录', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-15 14:30:25' },
          { id: 2, username: 'admin', type: 'config', action: '修改系统设置-认证阈值', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-15 14:25:10' },
          { id: 3, username: 'admin', type: 'channel', action: '启用百度AI通道', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-15 14:20:33' },
          { id: 4, username: 'admin', type: 'channel', action: '测试腾讯云通道连接', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-15 14:15:45' },
          { id: 5, username: 'admin', type: 'config', action: '保存魔方财务配置', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-15 14:10:00' },
          { id: 6, username: 'admin', type: 'delete', action: '删除认证记录 SM202403140099', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-15 13:50:20' },
          { id: 7, username: 'admin', type: 'login', action: '管理员登录', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-15 09:00:00' },
          { id: 8, username: 'admin', type: 'login', action: '管理员登录', ip: '10.0.0.5', status: 'failed', createdAt: '2024-03-14 22:30:15' },
          { id: 9, username: 'admin', type: 'config', action: '修改管理员密码', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-14 16:45:30' },
          { id: 10, username: 'admin', type: 'other', action: '导出认证记录', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-14 15:20:00' },
          { id: 11, username: 'admin', type: 'channel', action: '添加Face++通道', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-14 14:10:25' },
          { id: 12, username: 'admin', type: 'channel', action: '调整通道优先级', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-14 13:55:40' },
          { id: 13, username: 'admin', type: 'config', action: '保存安全设置', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-14 11:30:00' },
          { id: 14, username: 'admin', type: 'login', action: '管理员登录', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-14 09:05:12' },
          { id: 15, username: 'admin', type: 'other', action: '清理过期数据', ip: '192.168.1.100', status: 'success', createdAt: '2024-03-13 23:00:00' }
        ];
        
        function typeText(type) {
          const map = { login: '登录', config: '配置', channel: '通道', delete: '删除', other: '其他' };
          return map[type] || type;
        }
        
        function typeColor(type) {
          const map = { login: '', config: 'warning', channel: 'primary', delete: 'danger', other: 'info' };
          return map[type] || 'info';
        }
        
        function resetFilters() {
          filters.type = '';
          filters.username = '';
          filters.dateRange = [];
        }
        
        return { filters, currentPage, total, logs, typeText, typeColor, resetFilters };
      }
    };

    // ============================================
    // 路由配置
    // ============================================
    const routes = [
      { path: '/login', component: LoginView },
      {
        path: '/',
        component: AdminLayout,
        redirect: '/dashboard',
        children: [
          { path: 'dashboard', component: DashboardView },
          { path: 'verifications', component: VerificationsView },
          { path: 'channels', component: ChannelsView },
          { path: 'mofang', component: MofangView },
          { path: 'settings', component: SettingsView },
          { path: 'logs', component: LogsView }
        ]
      }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    // 路由守卫
    router.beforeEach((to, from, next) => {
      const token = localStorage.getItem('admin_token');
      if (to.path !== '/login' && !token) {
        next('/login');
      } else {
        next();
      }
    });

    // ============================================
    // 创建应用
    // ============================================
    const app = createApp({
      setup() {
        const loading = ref(true);
        
        onMounted(() => {
          setTimeout(() => {
            loading.value = false;
            
            // 隐藏页面加载动画
            const pageLoader = document.getElementById('pageLoader');
            if (pageLoader) {
              pageLoader.style.transition = 'opacity 0.5s ease, visibility 0.5s ease';
              pageLoader.style.opacity = '0';
              pageLoader.style.visibility = 'hidden';
              setTimeout(() => {
                pageLoader.style.display = 'none';
              }, 500);
            }
          }, 500);
        });
        
        return { loading };
      }
    });

    app.use(router);
    app.use(createPinia());
    app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });

    app.mount('#app');
  </script>
</body>
</html>
